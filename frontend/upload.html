<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>File Upload - File Server</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }
    </style>
</head>
<body>

<script>
    // Remove the getMainServerOrigin function and replace with API call
    let mainServerOrigin;
    let iframe = document.createElement('iframe');

    // Function to get main server URL from frontend server
    async function getMainServerURL() {
        try {
            const response = await fetch('/api/main-server-url', {
                credentials: 'include' // Include cookies in the request
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error('Failed to get main server URL');
            }
            return new URL(data.url);
        } catch (error) {
            console.error('Error fetching main server URL:', error);
            window.location.href = '/login';
            throw error;
        }
    }

    // Initialize iframe with main server URL
    async function initializeIframe() {
        try {
            const mainServerURL = await getMainServerURL();
            mainServerOrigin = mainServerURL.origin;

            // Create and append the iframe
            iframe.src = new URL('/index.html', mainServerURL).href;
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = 'none';
            iframe.allow = 'clipboard-write';
            document.body.appendChild(iframe);
        } catch (error) {
            console.error('Failed to initialize iframe:', error);
        }
    }

    let sessionId = null;

    // Call initializeIframe when the page loads
    initializeIframe();

    // Update message event listener to use dynamic origin
    function receiveMessage(event) {
        // Security check: Ensure the message is from the main server's origin
        if (event.origin !== mainServerOrigin) {
            console.warn('Received message from unknown origin:', event.origin);
            return;
        }

        const data = event.data;

        if (data.type === 'REQUEST_TOKEN') {
            if (!sessionId) {
                if (window['fileUploadIframeSeenSessionIDs'] && window['fileUploadIframeSeenSessionIDs'][data.sessionId]) {
                    return;
                } else {
                    window['fileUploadIframeSeenSessionIDs'] = window['fileUploadIframeSeenSessionIDs'] || {};
                    window['fileUploadIframeSeenSessionIDs'][data.sessionId] = true;
                    sessionId = data.sessionId;
                }
            }

            if (data.sessionId !== sessionId) {
                return;
            }

            // Fetch the JWT token from the frontend server's /api/token
            fetch('/api/token', {
                credentials: 'include' // Include cookies in the request
            })
                .then(response => response.json())
                .then(tokenData => {
                    if (tokenData.token) {
                        iframe.contentWindow.postMessage({
                            type: 'TOKEN_RESPONSE',
                            token: tokenData.token,
                            sessionId: sessionId,
                            wantsCallback: false
                        }, mainServerOrigin);
                    } else {
                        console.error('Failed to retrieve JWT token.');
                        // Optionally, you can redirect to login or show an error
                        window.location.href = '/login';
                    }
                })
                .catch(error => {
                    console.error('Error fetching JWT token:', error);
                    // Optionally, redirect to login or show an error
                    window.location.href = '/login';
                });
        } else if (data.type === 'UPLOAD_COMPLETE') {
            // Handle upload completion if needed
            console.log('Upload completed:', data.files);
            // You can display a success message or perform other actions
        }
    }

    // Listen for messages from the iframe
    window.addEventListener('message', receiveMessage);
</script>
</body>
</html>
